:root{
  --bg:#0c111c;
  --surface:#131b2e;
  --surface2:#1a243d;
  --line:#223052;
  --text:#e8edf7;
  --muted:#8ea0c4;
  --primary:#4f8cff;
  --primary-glow:rgba(79,140,255,.35);
  --accent:#38d9a9;
  --card-shadow:0 12px 32px -8px rgba(3,8,20,.6);
  --radius:16px;
  --display:'Space Grotesk',sans-serif;
  --sans:'Plus Jakarta Sans',sans-serif;
}
[data-theme="light"]{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface2:#eef2fa;
  --line:#dce3f1;
  --text:#0e172a;
  --muted:#5a6885;
  --primary:#2d6cdf;
  --primary-glow:rgba(45,108,223,.25);
  --accent:#0ca678;
  --card-shadow:0 14px 34px -10px rgba(20,35,70,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
header{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  background:rgba(12,17,28,.75);
  border-bottom:1px solid var(--line);
  transition:background .3s;
}
[data-theme="light"] header{background:rgba(244,246,251,.85)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.brand svg{width:34px;height:34px;fill:var(--primary)}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.02em}
.brand-text span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.nav-links{display:flex;align-items:center;gap:20px}
.nav-links a{color:var(--muted);text-decoration:none;font-weight:500;font-size:.95rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.theme-btn{
  background:var(--surface2);border:1px solid var(--line);color:var(--text);
