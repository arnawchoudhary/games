<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AutoDraw | Arnaw Studios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent !important;
  -webkit-touch-callout: none !important;
  -webkit-user-select: none !important;
  -moz-user-select: none !important;
  -ms-user-select: none !important;
  user-select: none !important;
}

:root {
  --font-main: 'Plus Jakarta Sans', sans-serif;
  --font-display: 'Orbitron', sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
  --transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}

/* DARK THEME */
[data-theme="dark"] {
  color-scheme: dark;
  --bg-base: #060a12;
  --bg-surface: #0c1220;
  --bg-surface-elevated: #131c30;
  --bg-surface-hover: #1b2640;
  --border: #1e2c48;
  --border-subtle: #141f33;
  --text-primary: #edf5ff;
  --text-secondary: #90a4c4;
  --text-muted: #5a7094;
  --accent: #00f3ff;
  --accent-secondary: #ff3b4b;
  --accent-glow: rgba(0, 243, 255, 0.28);
  --accent-subtle: rgba(0, 243, 255, 0.1);
  --canvas-bg: #ffffff;
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* LIGHT THEME */
[data-theme="light"] {
  color-scheme: light;
  --bg-base: #eef3f9;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #f5f8fc;
  --bg-surface-hover: #e8eff8;
  --border: #d0dbe8;
  --border-subtle: #e2eaf4;
  --text-primary: #0a1120;
  --text-secondary: #4a5c78;
  --text-muted: #8294ae;
  --accent: #0077ff;
  --accent-secondary: #ff3b4b;
  --accent-glow: rgba(0, 119, 255, 0.22);
  --accent-subtle: rgba(0, 119, 255, 0.08);
  --canvas-bg: #ffffff;
  --shadow-sm: 0 2px 8px rgba(10, 17, 32, 0.08);
  --shadow-md: 0 10px 25px rgba(10, 17, 32, 0.12);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-main);
  touch-action: none !important;
  overscroll-behavior: none !important;
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: none;
  outline: none;
  touch-action: none !important;
}
button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.svg-icon {
  width: 18px;
  height: 18px;
  display: inline-block;
  vertical-align: middle;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

/* TOPBAR */
.app-topbar {
  height: 60px;
  padding: 0 16px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  z-index: 50;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.brand-logo {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #00f3ff 0%, #0077ff 100%);
  color: #040914;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 18px;
  box-shadow: 0 4px 14px var(--accent-glow);
}

.brand-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1.1;
}
.brand-title span {
  color: var(--accent);
}
.brand-tag {
  font-size: 9px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

/* AI SUGGESTION BANNER ("Do you mean:") */
.ai-suggestions-bar {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 10px;
  scrollbar-width: none;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  max-width: 620px;
  height: 42px;
}
.ai-suggestions-bar::-webkit-scrollbar {
  display: none;
}

.suggestion-label {
  font-size: 11px;
  font-weight: 800;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  letter-spacing: 0.5px;
}

.suggestion-items-list {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
}

.suggestion-pill {
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: var(--transition);
}
.suggestion-pill:hover,
.suggestion-pill:active {
  border-color: var(--accent);
  background: var(--accent-subtle);
  color: var(--accent);
  transform: translateY(-1px);
}

/* TOPBAR ACTIONS */
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: var(--radius-md);
  font-size: 12px;
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  transition: var(--transition);
  text-decoration: none;
}
.btn-action:hover {
  background: var(--bg-surface-hover);
  border-color: var(--text-muted);
}

.btn-download-jpg {
  background: linear-gradient(135deg, #00f3ff 0%, #0088ff 100%);
  color: #060b17 !important;
  border: none;
  font-weight: 800;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-download-jpg:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

.btn-icon-square {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.btn-icon-square:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* WORKSPACE */
.app-workspace {
  flex: 1;
  display: flex;
  position: relative;
  background: var(--bg-base);
  overflow: hidden;
}

/* FLOATING LEFT TOOLBAR */
.tools-panel {
  position: absolute;
  left: 16px;
  top: 16px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 20;
  backdrop-filter: blur(12px);
}

.tool-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 9px;
  font-weight: 800;
  gap: 3px;
  transition: var(--transition);
}
.tool-btn:hover {
  background: var(--bg-surface-hover);
  color: var(--text-primary);
}
.tool-btn.active {
  background: var(--accent);
  color: #040914;
  box-shadow: 0 4px 12px var(--accent-glow);
}

.tool-divider {
  height: 1px;
  background: var(--border);
  margin: 3px 0;
}

/* FLOATING BOTTOM PALETTE */
.palette-panel {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 8px 18px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 20;
  backdrop-filter: blur(12px);
  max-width: 95%;
  overflow-x: auto;
}

.color-swatches-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.color-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: var(--transition);
  flex-shrink: 0;
}
.color-dot:hover {
  transform: scale(1.15);
}
.color-dot.active {
  border-color: #ffffff;
  box-shadow: 0 0 0 2px var(--accent);
  transform: scale(1.2);
}

.color-picker-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px dashed var(--text-muted);
  background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.color-picker-input {
  position: absolute;
  inset: -10px;
  opacity: 0;
  cursor: pointer;
}

.palette-divider {
  width: 1px;
  height: 22px;
  background: var(--border);
  flex-shrink: 0;
}

.size-selectors-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.size-circle-btn {
  border-radius: 50%;
  background: var(--text-muted);
  cursor: pointer;
  transition: var(--transition);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.size-circle-btn.active {
  background: var(--accent);
  transform: scale(1.2);
  box-shadow: 0 0 0 2px var(--bg-surface), 0 0 0 4px var(--accent);
}

/* CANVAS WRAPPER */
.canvas-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  position: relative;
  overflow: hidden;
}

#drawCanvas {
  background: var(--canvas-bg);
  border-radius: var(--radius-lg);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  cursor: crosshair;
  touch-action: none !important;
  display: block;
  max-width: 100%;
  max-height: 100%;
}

/* TOAST POPUP */
.toast-popup {
  position: fixed;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 18px;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--accent);
  border-radius: var(--radius-pill);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 700;
  box-shadow: var(--shadow-md);
  z-index: 1000;
  opacity: 0;
  transition: var(--transition);
  pointer-events: none;
  white-space: nowrap;
}
.toast-popup.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* SHAPES DRAWER POPUP */
#shapesModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
#shapesModal.open {
  display: flex;
}
.shapes-dialog {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  max-width: 480px;
  width: 90%;
  box-shadow: var(--shadow-md);
}
.shapes-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 16px;
}
.shape-card-btn {
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 6px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
}
.shape-card-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-subtle);
}

@media (max-width: 860px) {
  .brand-tag { display: none; }
  .ai-suggestions-bar { max-width: 320px; }
  .btn-download-jpg span { display: none; }
}

@media (max-width: 600px) {
  .app-topbar { padding: 0 10px; height: 54px; }
  .brand-title { display: none; }
  .tools-panel { left: 8px; top: 8px; padding: 6px; }
  .tool-btn { width: 38px; height: 38px; font-size: 8px; }
  .palette-panel { bottom: 8px; padding: 6px 12px; gap: 8px; }
  .color-dot { width: 20px; height: 20px; }
  .ai-suggestions-bar { max-width: 220px; height: 36px; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="app-topbar">
  <div class="brand-section">
    <div class="brand-logo">A</div>
    <div>
      <div class="brand-title">AUTO<span>DRAW</span></div>
      <div class="brand-tag">ARNAW STUDIOS</div>
    </div>
  </div>

  <!-- AI AUTO-DRAW SUGGESTIONS ("Do you mean:") -->
  <div class="ai-suggestions-bar" id="suggestionBar">
    <div class="suggestion-label">
      <svg class="svg-icon" style="width:14px;height:14px" viewBox="0 0 24 24">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
      </svg>
      Do you mean:
    </div>
    <div class="suggestion-items-list" id="suggestionList">
      <button class="suggestion-pill" onclick="applyArtwork('star')">⭐ Star</button>
      <button class="suggestion-pill" onclick="applyArtwork('heart')">❤️ Heart</button>
      <button class="suggestion-pill" onclick="applyArtwork('car')">🚗 Car</button>
      <button class="suggestion-pill" onclick="applyArtwork('house')">🏠 House</button>
      <button class="suggestion-pill" onclick="applyArtwork('cat')">🐱 Cat</button>
      <button class="suggestion-pill" onclick="applyArtwork('cloud')">☁️ Cloud</button>
      <button class="suggestion-pill" onclick="applyArtwork('sun')">☀️ Sun</button>
      <button class="suggestion-pill" onclick="applyArtwork('rocket')">🚀 Rocket</button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="topbar-actions">
    <button class="btn-icon-square" id="undoBtn" title="Undo (Ctrl+Z)">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="M9 14 4 9l5-5"/>
        <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
      </svg>
    </button>
    <button class="btn-icon-square" id="redoBtn" title="Redo (Ctrl+Y)">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="m15 14 5-5-5-5"/>
        <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
      </svg>
    </button>
    <button class="btn-action" id="clearBtn" title="Clear Canvas">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      Clear
    </button>
    <button class="btn-action btn-download-jpg" id="downloadJpgBtn" title="Download JPG Image">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Download JPG</span>
    </button>
    <button class="btn-icon-square" id="themeToggleBtn" title="Toggle Light/Dark Theme"></button>
    <a href="index.html" class="btn-action" title="Back to Games">⬅ Home</a>
  </div>
</header>

<!-- WORKSPACE -->
<main class="app-workspace">
  <!-- TOOLS PANEL -->
  <aside class="tools-panel">
    <button class="tool-btn active" id="toolAutoDraw" title="AutoDraw Magic Pen">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
      </svg>
      Magic
    </button>
    <button class="tool-btn" id="toolDraw" title="Freehand Pen">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      </svg>
      Pen
    </button>
    <button class="tool-btn" id="toolEraser" title="Eraser">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
        <path d="M22 21H7"/>
        <path d="m5 11 9 9"/>
      </svg>
      Eraser
    </button>
    <button class="tool-btn" id="toolFill" title="Fill Canvas Background">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
        <path d="m5 2 5 5"/>
        <path d="M2 13h15"/>
      </svg>
      Fill
    </button>
    <div class="tool-divider"></div>
    <button class="tool-btn" id="toolShapes" title="Shapes Gallery" onclick="openShapesModal()">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      Shapes
    </button>
  </aside>

  <!-- CANVAS -->
  <div class="canvas-container">
    <canvas id="drawCanvas"></canvas>
  </div>

  <!-- BOTTOM PALETTE -->
  <div class="palette-panel">
    <div class="color-swatches-row">
      <div class="color-dot active" style="background:#0c1220" data-color="#0c1220"></div>
      <div class="color-dot" style="background:#ff3b4b" data-color="#ff3b4b"></div>
      <div class="color-dot" style="background:#ff8800" data-color="#ff8800"></div>
      <div class="color-dot" style="background:#ffcc00" data-color="#ffcc00"></div>
      <div class="color-dot" style="background:#00f5a0" data-color="#00f5a0"></div>
      <div class="color-dot" style="background:#00f3ff" data-color="#00f3ff"></div>
      <div class="color-dot" style="background:#3b82f6" data-color="#3b82f6"></div>
      <div class="color-dot" style="background:#8b5cf6" data-color="#8b5cf6"></div>
      <div class="color-dot" style="background:#ec4899" data-color="#ec4899"></div>
      <div class="color-picker-btn" title="Choose Custom Color">
        <input type="color" id="customColorPicker" class="color-picker-input" value="#0c1220">
      </div>
    </div>
    <div class="palette-divider"></div>
    <div class="size-selectors-row">
      <div class="size-circle-btn" data-size="3" style="width:10px;height:10px" title="Fine (3px)"></div>
      <div class="size-circle-btn active" data-size="6" style="width:16px;height:16px" title="Medium (6px)"></div>
      <div class="size-circle-btn" data-size="12" style="width:22px;height:22px" title="Bold (12px)"></div>
      <div class="size-circle-btn" data-size="22" style="width:28px;height:28px" title="Heavy (22px)"></div>
    </div>
  </div>
</main>

<!-- SHAPES MODAL -->
<div id="shapesModal">
  <div class="shapes-dialog">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-family:var(--font-display); font-size:16px; letter-spacing:1px;">Insert Vector Shape</h3>
      <button onclick="closeShapesModal()" style="font-size:20px; font-weight:800; color:var(--text-muted);">&times;</button>
    </div>
    <div class="shapes-grid">
      <button class="shape-card-btn" onclick="insertShape('star')">⭐ Star</button>
      <button class="shape-card-btn" onclick="insertShape('heart')">❤️ Heart</button>
      <button class="shape-card-btn" onclick="insertShape('car')">🚗 Car</button>
      <button class="shape-card-btn" onclick="insertShape('house')">🏠 House</button>
      <button class="shape-card-btn" onclick="insertShape('cloud')">☁️ Cloud</button>
      <button class="shape-card-btn" onclick="insertShape('sun')">☀️ Sun</button>
      <button class="shape-card-btn" onclick="insertShape('rocket')">🚀 Rocket</button>
      <button class="shape-card-btn" onclick="insertShape('cat')">🐱 Cat</button>
      <button class="shape-card-btn" onclick="insertShape('tree')">🌲 Tree</button>
      <button class="shape-card-btn" onclick="insertShape('moon')">🌙 Moon</button>
      <button class="shape-card-btn" onclick="insertShape('flower')">🌸 Flower</button>
      <button class="shape-card-btn" onclick="insertShape('lightning')">⚡ Lightning</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-popup" id="toast"></div>

<script>
// Anti-Zoom & Anti-Copy Protection
window.addEventListener("contextmenu", e => { e.preventDefault(); return false; }, { capture: true, passive: false });
window.addEventListener("selectstart", e => { e.preventDefault(); return false; }, { capture: true, passive: false });

let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd <= 350) {
    if (e.cancelable) e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener("gesturestart", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener("gesturechange", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener("gestureend", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

let isDrawing = false;
let activeTool = "autodraw"; // 'autodraw', 'draw', 'eraser', 'fill'
let currentColor = "#0c1220";
let currentBrushSize = 6;
let canvasBackgroundColor = "#ffffff";

let historyStack = [];
let redoStack = [];
let strokePoints = [];
let allStrokesInSession = [];

// High-DPI Canvas Resizing
function resizeCanvas() {
  const container = canvas.parentElement;
  const width = Math.min(container.clientWidth - 32, 1400);
  const height = Math.min(container.clientHeight - 32, 900);

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = canvas.width;
  tempCanvas.height = canvas.height;
  if (canvas.width > 0 && canvas.height > 0) {
    tempCanvas.getContext("2d").drawImage(canvas, 0, 0);
  }

  const dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.fillStyle = canvasBackgroundColor;
  ctx.fillRect(0, 0, width, height);

  if (tempCanvas.width > 0) {
    ctx.drawImage(tempCanvas, 0, 0, width, height);
  }

  saveCanvasState();
}

window.addEventListener("resize", () => {
  clearTimeout(window.resizeTimer);
  window.resizeTimer = setTimeout(resizeCanvas, 150);
});

// Accurate Touch & Mouse Coordinates
function getCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
  const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

// Drawing Handlers
function startDrawing(e) {
  if (e.cancelable) e.preventDefault();
  if (activeTool === "fill") {
    fillBackground(currentColor);
    return;
  }

  isDrawing = true;
  const { x, y } = getCoords(e);
  strokePoints = [{ x, y }];

  ctx.beginPath();
  ctx.moveTo(x, y);

  if (activeTool === "eraser") {
    ctx.strokeStyle = canvasBackgroundColor;
    ctx.lineWidth = currentBrushSize * 3;
  } else {
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentBrushSize;
  }
}

function draw(e) {
  if (!isDrawing) return;
  if (e.cancelable) e.preventDefault();

  const { x, y } = getCoords(e);
  strokePoints.push({ x, y });

  // Smooth quadratic curve drawing
  if (strokePoints.length > 2) {
    const p1 = strokePoints[strokePoints.length - 2];
    const p2 = strokePoints[strokePoints.length - 1];
    const midX = (p1.x + p2.x) / 2;
    const midY = (p1.y + p2.y) / 2;
    ctx.quadraticCurveTo(p1.x, p1.y, midX, midY);
  } else {
    ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function stopDrawing(e) {
  if (!isDrawing) return;
  if (e && e.cancelable) e.preventDefault();
  isDrawing = false;
  ctx.closePath();

  if (strokePoints.length > 1) {
    allStrokesInSession.push([...strokePoints]);
    saveCanvasState();
    if (activeTool === "autodraw") {
      predictAutoDraw(strokePoints);
    }
  }
}

// Pointer Events for Cross-Device Smoothness
canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
window.addEventListener("pointerup", stopDrawing);
window.addEventListener("pointercancel", stopDrawing);

// History State (Undo / Redo)
function saveCanvasState() {
  if (historyStack.length >= 30) historyStack.shift();
  historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  redoStack = [];
  updateHistoryButtons();
}

function updateHistoryButtons() {
  document.getElementById("undoBtn").disabled = historyStack.length <= 1;
  document.getElementById("redoBtn").disabled = redoStack.length === 0;
}

function undo() {
  if (historyStack.length > 1) {
    redoStack.push(historyStack.pop());
    const prevState = historyStack[historyStack.length - 1];
    ctx.putImageData(prevState, 0, 0);
    allStrokesInSession.pop();
    showToast("Undo applied");
  }
  updateHistoryButtons();
}

function redo() {
  if (redoStack.length > 0) {
    const nextState = redoStack.pop();
    historyStack.push(nextState);
    ctx.putImageData(nextState, 0, 0);
    showToast("Redo applied");
  }
  updateHistoryButtons();
}

document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);

window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") {
    e.preventDefault();
    redo();
  }
});

// Clear Canvas
function clearCanvas() {
  const w = parseFloat(canvas.style.width);
  const h = parseFloat(canvas.style.height);
  canvasBackgroundColor = "#ffffff";
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  allStrokesInSession = [];
  historyStack = [];
  redoStack = [];
  saveCanvasState();
  showToast("Canvas cleared");
}
document.getElementById("clearBtn").addEventListener("click", clearCanvas);

// Fill Background
function fillBackground(color) {
  canvasBackgroundColor = color;
  const w = parseFloat(canvas.style.width);
  const h = parseFloat(canvas.style.height);
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, w, h);
  saveCanvasState();
  showToast("Background filled");
}

// Download JPG
function downloadJPG() {
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const expCtx = exportCanvas.getContext("2d");

  // Fill crisp background
  expCtx.fillStyle = canvasBackgroundColor || "#ffffff";
  expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
  expCtx.drawImage(canvas, 0, 0);

  const jpgUrl = exportCanvas.toDataURL("image/jpeg", 0.95);
  const link = document.createElement("a");
  const time = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  link.download = `autodraw-${time}.jpg`;
  link.href = jpgUrl;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast("Downloaded artwork as JPG!");
}
document.getElementById("downloadJpgBtn").addEventListener("click", downloadJPG);

// Smart AI AutoDraw Shape Prediction
function predictAutoDraw(points) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  points.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });

  const width = maxX - minX;
  const height = maxY - minY;
  const aspectRatio = width / (height || 1);
  const isClosed = Math.hypot(points[0].x - points[points.length - 1].x, points[0].y - points[points.length - 1].y) < 65;

  let suggestions = [];
  if (isClosed && Math.abs(aspectRatio - 1) < 0.35) {
    suggestions = [
      { id: "star", label: "⭐ Star" },
      { id: "sun", label: "☀️ Sun" },
      { id: "heart", label: "❤️ Heart" },
      { id: "moon", label: "🌙 Moon" }
    ];
  } else if (aspectRatio > 1.35) {
    suggestions = [
      { id: "car", label: "🚗 Car" },
      { id: "cloud", label: "☁️ Cloud" },
      { id: "rocket", label: "🚀 Rocket" },
      { id: "house", label: "🏠 House" }
    ];
  } else if (height > width * 1.3) {
    suggestions = [
      { id: "tree", label: "🌲 Tree" },
      { id: "rocket", label: "🚀 Rocket" },
      { id: "lightning", label: "⚡ Lightning" },
      { id: "house", label: "🏠 House" }
    ];
  } else {
    suggestions = [
      { id: "heart", label: "❤️ Heart" },
      { id: "star", label: "⭐ Star" },
      { id: "cat", label: "🐱 Cat" },
      { id: "flower", label: "🌸 Flower" }
    ];
  }

  const list = document.getElementById("suggestionList");
  list.innerHTML = suggestions.map(s => `
    <button class="suggestion-pill" onclick="applyArtwork('${s.id}')">${s.label}</button>
  `).join("");
}

// Transform Doodle into Vector Artwork
function applyArtwork(shapeId) {
  if (allStrokesInSession.length === 0) {
    insertShape(shapeId);
    return;
  }

  undo(); // remove the rough doodle
  const lastStroke = strokePoints.length ? strokePoints : allStrokesInSession[allStrokesInSession.length - 1] || [];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  lastStroke.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });

  const boxW = Math.max(maxX - minX, 110);
  const boxH = Math.max(maxY - minY, 110);
  drawVectorShape(shapeId, minX, minY, boxW, boxH);
  showToast(`Transformed to ${shapeId.toUpperCase()}!`);
}

function insertShape(shapeId) {
  closeShapesModal();
  const w = parseFloat(canvas.style.width);
  const h = parseFloat(canvas.style.height);
  drawVectorShape(shapeId, w / 2 - 100, h / 2 - 100, 200, 200);
  showToast(`Added ${shapeId.toUpperCase()}!`);
}

// Vector Render Engine
function drawVectorShape(shape, x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = currentColor;
  ctx.lineWidth = Math.max(currentBrushSize, 4);
  ctx.beginPath();

  const cx = x + w / 2;
  const cy = y + h / 2;

  if (shape === "star") {
    const spikes = 5;
    const outerR = Math.min(w, h) / 2;
    const innerR = outerR / 2.3;
    let rot = (Math.PI / 2) * 3;
    let step = Math.PI / spikes;
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.closePath();
  } else if (shape === "heart") {
    const s = Math.min(w, h);
    ctx.moveTo(cx, cy + s / 4);
    ctx.bezierCurveTo(cx - s / 2, cy - s / 4, cx - s / 2, cy - s * 0.6, cx, cy - s * 0.35);
    ctx.bezierCurveTo(cx + s / 2, cy - s * 0.6, cx + s / 2, cy - s / 4, cx, cy + s / 4);
  } else if (shape === "car") {
    ctx.roundRect(x, y + h * 0.45, w, h * 0.35, 12);
    ctx.moveTo(x + w * 0.18, y + h * 0.45);
    ctx.lineTo(x + w * 0.35, y + h * 0.15);
    ctx.lineTo(x + w * 0.72, y + h * 0.15);
    ctx.lineTo(x + w * 0.88, y + h * 0.45);
    ctx.moveTo(x + w * 0.25 + 16, y + h * 0.82);
    ctx.arc(x + w * 0.25, y + h * 0.82, 16, 0, Math.PI * 2);
    ctx.moveTo(x + w * 0.75 + 16, y + h * 0.82);
    ctx.arc(x + w * 0.75, y + h * 0.82, 16, 0, Math.PI * 2);
  } else if (shape === "house") {
    ctx.strokeRect(x + w * 0.15, y + h * 0.4, w * 0.7, h * 0.55);
    ctx.moveTo(x + w * 0.1, y + h * 0.4);
    ctx.lineTo(cx, y + h * 0.1);
    ctx.lineTo(x + w * 0.9, y + h * 0.4);
    ctx.closePath();
    ctx.strokeRect(cx - w * 0.1, y + h * 0.65, w * 0.2, h * 0.3);
  } else if (shape === "cloud") {
    ctx.arc(cx - w * 0.2, cy, w * 0.2, Math.PI * 0.5, Math.PI * 1.5);
    ctx.arc(cx - w * 0.05, cy - h * 0.2, w * 0.22, Math.PI * 1, Math.PI * 1.85);
    ctx.arc(cx + w * 0.18, cy - h * 0.1, w * 0.2, Math.PI * 1.35, Math.PI * 0.1);
    ctx.arc(cx + w * 0.2, cy + h * 0.08, w * 0.18, Math.PI * 1.8, Math.PI * 0.5);
    ctx.closePath();
  } else if (shape === "sun") {
    ctx.arc(cx, cy, Math.min(w, h) * 0.24, 0, Math.PI * 2);
    for (let i = 0; i < 8; i++) {
      const angle = (i * Math.PI) / 4;
      const r1 = Math.min(w, h) * 0.32;
      const r2 = Math.min(w, h) * 0.45;
      ctx.moveTo(cx + Math.cos(angle) * r1, cy + Math.sin(angle) * r1);
      ctx.lineTo(cx + Math.cos(angle) * r2, cy + Math.sin(angle) * r2);
    }
  } else if (shape === "rocket") {
    ctx.moveTo(cx, y + h * 0.05);
    ctx.quadraticCurveTo(cx + w * 0.3, y + h * 0.4, cx + w * 0.2, y + h * 0.8);
    ctx.lineTo(cx - w * 0.2, y + h * 0.8);
    ctx.quadraticCurveTo(cx - w * 0.3, y + h * 0.4, cx, y + h * 0.05);
    ctx.moveTo(cx - w * 0.2, y + h * 0.65);
    ctx.lineTo(cx - w * 0.42, y + h * 0.85);
    ctx.lineTo(cx - w * 0.2, y + h * 0.8);
    ctx.moveTo(cx + w * 0.2, y + h * 0.65);
    ctx.lineTo(cx + w * 0.42, y + h * 0.85);
    ctx.lineTo(cx + w * 0.2, y + h * 0.8);
    ctx.moveTo(cx + 12, cy - h * 0.05);
    ctx.arc(cx, cy - h * 0.05, 12, 0, Math.PI * 2);
  } else if (shape === "cat") {
    ctx.arc(cx, cy, Math.min(w, h) * 0.35, 0, Math.PI * 2);
    ctx.moveTo(cx - w * 0.25, cy - h * 0.25);
    ctx.lineTo(cx - w * 0.35, cy - h * 0.5);
    ctx.lineTo(cx - w * 0.1, cy - h * 0.33);
    ctx.moveTo(cx + w * 0.25, cy - h * 0.25);
    ctx.lineTo(cx + w * 0.35, cy - h * 0.5);
    ctx.lineTo(cx + w * 0.1, cy - h * 0.33);
    ctx.moveTo(cx - w * 0.1, cy + 5);
    ctx.lineTo(cx - w * 0.45, cy);
    ctx.moveTo(cx - w * 0.1, cy + 12);
    ctx.lineTo(cx - w * 0.45, cy + 20);
    ctx.moveTo(cx + w * 0.1, cy + 5);
    ctx.lineTo(cx + w * 0.45, cy);
    ctx.moveTo(cx + w * 0.1, cy + 12);
    ctx.lineTo(cx + w * 0.45, cy + 20);
  } else if (shape === "tree") {
    ctx.moveTo(cx, y + h * 0.1);
    ctx.lineTo(cx + w * 0.3, y + h * 0.4);
    ctx.lineTo(cx + w * 0.15, y + h * 0.4);
    ctx.lineTo(cx + w * 0.38, y + h * 0.7);
    ctx.lineTo(cx + w * 0.1, y + h * 0.7);
    ctx.lineTo(cx + w * 0.1, y + h * 0.95);
    ctx.lineTo(cx - w * 0.1, y + h * 0.95);
    ctx.lineTo(cx - w * 0.1, y + h * 0.7);
    ctx.lineTo(cx - w * 0.38, y + h * 0.7);
    ctx.lineTo(cx - w * 0.15, y + h * 0.4);
    ctx.lineTo(cx - w * 0.3, y + h * 0.4);
    ctx.closePath();
  } else if (shape === "moon") {
    const r = Math.min(w, h) * 0.4;
    ctx.arc(cx - r * 0.2, cy, r, -0.4 * Math.PI, 0.4 * Math.PI, false);
    ctx.arc(cx - r * 0.8, cy, r * 0.85, 0.35 * Math.PI, -0.35 * Math.PI, true);
    ctx.closePath();
  } else if (shape === "flower") {
    const r = Math.min(w, h) * 0.15;
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    for (let i = 0; i < 6; i++) {
      const angle = (i * Math.PI) / 3;
      const px = cx + Math.cos(angle) * r * 2.2;
      const py = cy + Math.sin(angle) * r * 2.2;
      ctx.moveTo(px + r, py);
      ctx.arc(px, py, r, 0, Math.PI * 2);
    }
  } else if (shape === "lightning") {
    ctx.moveTo(cx + w * 0.1, y + h * 0.05);
    ctx.lineTo(cx - w * 0.3, y + h * 0.5);
    ctx.lineTo(cx, y + h * 0.5);
    ctx.lineTo(cx - w * 0.15, y + h * 0.95);
    ctx.lineTo(cx + w * 0.35, y + h * 0.4);
    ctx.lineTo(cx + w * 0.05, y + h * 0.4);
    ctx.closePath();
  }

  ctx.stroke();
  ctx.restore();
  saveCanvasState();
}

// Tool Switching
const toolButtons = [
  { id: "toolAutoDraw", mode: "autodraw" },
  { id: "toolDraw", mode: "draw" },
  { id: "toolEraser", mode: "eraser" },
  { id: "toolFill", mode: "fill" }
];
toolButtons.forEach(t => {
  const btn = document.getElementById(t.id);
  btn.addEventListener("click", () => {
    toolButtons.forEach(item => document.getElementById(item.id).classList.remove("active"));
    btn.classList.add("active");
    activeTool = t.mode;
    showToast(`Active Tool: ${btn.title}`);
  });
});

// Color Swatches
document.querySelectorAll(".color-dot").forEach(dot => {
  dot.addEventListener("click", () => {
    document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
    dot.classList.add("active");
    currentColor = dot.dataset.color;
  });
});
document.getElementById("customColorPicker").addEventListener("input", e => {
  currentColor = e.target.value;
  document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
});

// Brush Sizes
document.querySelectorAll(".size-circle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".size-circle-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentBrushSize = parseInt(btn.dataset.size);
  });
});

// Theme Switching
const themeBtn = document.getElementById("themeToggleBtn");
const themeIcons = {
  dark: `<svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>`,
  light: `<svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>`
};

let currentTheme = localStorage.getItem("autodraw-theme") || "dark";
function setTheme(theme) {
  currentTheme = theme;
  localStorage.setItem("autodraw-theme", theme);
  document.documentElement.setAttribute("data-theme", theme);
  themeBtn.innerHTML = theme === "dark" ? themeIcons.light : themeIcons.dark;
}
themeBtn.addEventListener("click", () => {
  setTheme(currentTheme === "dark" ? "light" : "dark");
});

// Shapes Modal
function openShapesModal() {
  document.getElementById("shapesModal").classList.add("open");
}
function closeShapesModal() {
  document.getElementById("shapesModal").classList.remove("open");
}
document.getElementById("shapesModal").addEventListener("click", e => {
  if (e.target.id === "shapesModal") closeShapesModal();
});

// Toast Utility
function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("visible");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove("visible"), 2400);
}

// Initial Launch
setTheme(currentTheme);
resizeCanvas();
</script>
</body>
