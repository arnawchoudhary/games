<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Literata:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --page:#F3F5F1; --sheet:#FBFCFA; --ink:#1E2B2F;
  --muted:#5C6B70; --rule:#D5DDD8; --accent:#2F5D62;
  --accent-ink:#fff; --danger:#A23B3B; --sel:#E4ECE8;
  --ui:"Hanken Grotesk",sans-serif; --write:"Literata",Georgia,serif;
}
@media(prefers-color-scheme:dark) {
  :root {
    --page:#12191B;--sheet:#192225;--ink:#E4ECEA;
    --muted:#93A5A8;--rule:#2B3A3D;--accent:#7FB7BC;
    --accent-ink:#0F1A1C;--danger:#E08A8A;--sel:#223034;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.5 var(--ui);min-height:100vh}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:.6rem 1.1rem;font-weight:600}
.btn:disabled{opacity:.6}
.btn.quiet{background:transparent;color:var(--accent);border:1px solid var(--rule)}
.msg{min-height:1.5rem;margin:.75rem 0 0;font-size:.9rem;color:var(--muted)}
.msg.error{color:var(--danger)}
#auth{display:grid;place-items:center;min-height:100vh;padding:1.5rem}
.auth-card{width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:2rem}
.auth-card h1{font:600 2rem var(--write);margin:0 0 .25rem}
.auth-card p{color:var(--muted);margin-bottom:1.5rem}
label{display:block;font-size:.9rem;margin-bottom:.25rem}
input[type=email],input[type=password],input[type=text],input[type=date]{
 width:100%;padding:.6rem .7rem;border:1px solid var(--rule);
 border-radius:6px;background:var(--page);margin-bottom:1rem
}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
#app header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.5rem;border-bottom:1px solid var(--rule)}
#app header strong{font:600 1.25rem var(--write)}
#app header span{color:var(--muted);font-size:.9rem;margin-right:.75rem}
.layout{display:grid;grid-template-columns:280px 1fr;gap:1.5rem;max-width:1000px;margin:auto;padding:1.5rem}
aside h2{font-size:1rem;margin:0 0 .75rem}
#list{list-style:none;margin:.75rem 0 0;padding:0;max-height:70vh;overflow:auto}
#list button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:.6rem .75rem;border-radius:0 6px 6px 0}
#list button[aria-current=true]{background:var(--sel);border-left-color:var(--accent)}
#list .d{display:block;font-weight:600;font-size:.9rem}
#list .p{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:.9rem;padding:.5rem 0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:1.5rem}
.sheet .title{font:600 1.4rem var(--write);border:0;background:transparent;padding:.25rem 0;margin:0 0 .5rem;border-bottom:1px solid var(--rule);border-radius:0}
.sheet input[type=date]{width:auto}
#content{width:100%;min-height:50vh;resize:vertical;border:0;background:transparent;font:1.05rem/2rem var(--write);padding:0;margin-bottom:1rem;background-image:repeating-linear-gradient(transparent,transparent calc(2rem - 1px),var(--rule) calc(2rem - 1px),var(--rule) 2rem);background-attachment:local}
#content:focus-visible{outline:none}
@media(max-width:760px){
 .layout{grid-template-columns:1fr;padding:1rem}
 #list{max-height:200px}
 #app header{padding:.75rem 1rem}
}
</style>
</head>

<body>

<main id="auth" hidden>
 <div class="auth-card">
  <h1>My diary</h1>
  <p>Sign in to read and write your entries.</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" required>

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" minlength="6" required>

  <div class="row">
   <button class="btn" id="signin">Sign in</button>
   <button class="btn quiet" id="signup">Create account</button>
  </div>

  <p class="msg" id="authMsg" role="status"></p>
 </div>
</main>

<div id="app" hidden>
 <header>
  <strong>My diary</strong>
  <div>
   <span id="who"></span>
   <button class="btn quiet" id="signout">Sign out</button>
  </div>
 </header>

 <div class="layout">
  <aside>
   <h2>Your entries</h2>
   <button class="btn quiet" id="newEntry">Write today’s entry</button>
   <ul id="list"></ul>
  </aside>

  <section class="sheet">
   <label for="date">Date</label>
   <input id="date" type="date">
   <input id="title" class="title" type="text"
    placeholder="Title (optional)" aria-label="Title">
   <textarea id="content" placeholder="What happened today?"
    aria-label="Entry"></textarea>
   <button class="btn" id="save">Save entry</button>
   <p class="msg" id="saveMsg" role="status"></p>
  </section>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// SUPABASE CONFIGURATION
const SUPABASE_URL = 'https://cpdzzjvntkquwpibeosd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_wTrIDAFqTNDivXWGcagoWg_fYNb5Zio';

const $ = id => document.getElementById(id);

if (!window.supabase) {
  $('auth').hidden = false;
  $('authMsg').textContent = 'Supabase library failed to load.';
  throw new Error('Supabase library unavailable');
}

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let user = null;
let entries = [];
let busy = false;

const today = () => {
 const d = new Date();
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

const fmt = d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{
 weekday:'short',day:'numeric',month:'short',year:'numeric'
});

function say(el,text,error=false){
 el.textContent=text||'';
 el.classList.toggle('error',error);
}

function setBusy(value){
 busy=value;
 ['signin','signup'].forEach(id=>{
  if($(id)) $(id).disabled=value;
 });
}

function getCredentials(){
 const email = $('email').value.trim().toLowerCase();
 const password = $('password').value;
 if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
  say($('authMsg'),'Enter a valid email address.',true);
  return null;
 }
 if(!password || password.length < 6){
  say($('authMsg'),'Password must be at least 6 characters.',true);
  return null;
 }
 return { email, password };
}

// SIGN IN
async function signIn(){
 if(busy) return;
 const creds = getCredentials();
 if(!creds) return;

 setBusy(true);
 say($('authMsg'),'Signing in...');

 try {
  const { error } = await db.auth.signInWithPassword(creds);
  if(error) throw error;
 } catch(err) {
  say($('authMsg'), err.message, true);
 } finally {
  setBusy(false);
 }
}

// CREATE ACCOUNT
async function signUp(){
 if(busy) return;
 const creds = getCredentials();
 if(!creds) return;

 setBusy(true);
 say($('authMsg'),'Creating account...');

 try {
  const { data, error } = await db.auth.signUp(creds);
  if(error) throw error;

  if(!data.session) {
   say($('authMsg'), 'Account created! Signing you in...');
   await db.auth.signInWithPassword(creds);
  }
 } catch(err) {
  say($('authMsg'), err.message, true);
 } finally {
  setBusy(false);
 }
}

$('signin').onclick = signIn;
$('signup').onclick = signUp;

$('password').addEventListener('keydown', e => {
 if(e.key === 'Enter') signIn();
});

// SIGN OUT
$('signout').onclick=async()=>{
 const {error}=await db.auth.signOut();
 if(error)say($('saveMsg'),error.message,true);
};

// SESSION
db.auth.onAuthStateChange((_event,session)=>{
 applySession(session);
});

function applySession(session){
 user=session?.user||null;

 $('auth').hidden=!!user;
 $('app').hidden=!user;

 if(user){
  $('who').textContent=user.email||'';
  loadEntries();
 }else{
  entries=[];
  $('who').textContent='';
  $('list').replaceChildren();
  $('title').value='';
  $('content').value='';
  $('password').value='';
  $('date').value=today();
  say($('authMsg'),'');
 }
}

db.auth.getSession().then(({data,error})=>{
 if(error)throw error;
 applySession(data.session);
}).catch(err=>{
 $('auth').hidden=false;
 say($('authMsg'),err.message,true);
});

// LOAD ENTRIES
async function loadEntries(selectDate){
 if(!user)return;

 const userId=user.id;

 const {data,error}=await db.from('diary_entries')
  .select('id,entry_date,title,content')
  .order('entry_date',{ascending:false});

 if(error){
  say($('saveMsg'),error.message,true);
  return;
 }

 if(!user || user.id!==userId)return;

 entries=data||[];
 renderList();
 openDate(selectDate||$('date').value||today());
}

// RENDER SIDEBAR
function renderList(){
 const ul=$('list');
 ul.replaceChildren();

 if(!entries.length){
  const li=document.createElement('li');
  li.className='empty';
  li.textContent='No entries yet. Write your first one.';
  ul.append(li);
  return;
 }

 entries.forEach(entry=>{
  const li=document.createElement('li');
  const button=document.createElement('button');
  button.dataset.date=entry.entry_date;

  const date=document.createElement('span');
  date.className='d';
  date.textContent=fmt(entry.entry_date);

  const preview=document.createElement('span');
  preview.className='p';
  preview.textContent=entry.title ||
   (entry.content||'').split('\n')[0] || '(empty)';

  button.append(date,preview);
  button.onclick=()=>openDate(entry.entry_date);

  li.append(button);
  ul.append(li);
 });
}

// OPEN ENTRY
function openDate(date){
 const entry=entries.find(e=>e.entry_date===date);

 $('date').value=date;
 $('title').value=entry?.title||'';
 $('content').value=entry?.content||'';

 say($('saveMsg'),'');

 document.querySelectorAll('#list button').forEach(button=>{
  button.setAttribute('aria-current',button.dataset.date===date);
 });
}

$('date').onchange=()=>openDate($('date').value||today());
$('newEntry').onclick=()=>openDate(today());

// SAVE ENTRY
$('save').onclick=async()=>{
 if(!user){
  say($('saveMsg'),'Please sign in first.',true);
  return;
 }

 const entryDate=$('date').value;
 if(!entryDate){
  say($('saveMsg'),'Pick a date first.',true);
  return;
 }

 $('save').disabled=true;
 say($('saveMsg'),'Saving...');

 try{
  const userId=user.id;

  const {error}=await db.from('diary_entries').upsert({
   user_id:userId,
   entry_date:entryDate,
   title:$('title').value.trim()||null,
   content:$('content').value
  },{
   onConflict:'user_id,entry_date'
  });

  if(error)throw error;

  await loadEntries(entryDate);
  say($('saveMsg'),'Saved!');
 }catch(err){
  say($('saveMsg'),err.message,true);
 }finally{
  $('save').disabled=false;
 }
};
</script>
</body>
</html>
