
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Pixel Adventure</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10152b;
  color: white;
  font-family: monospace;
  text-align: center;
  overflow: hidden;
}
h1 {
  margin: 12px 0 5px;
  color: #ffe66d;
  text-shadow: 3px 3px #e94b3c;
}
#info { margin: 8px; font-size: 16px; }
#game {
  display: block;
  width: min(960px, 100vw);
  height: auto;
  margin: 0 auto;
  border: 4px solid #fff;
  image-rendering: pixelated;
  background: #78d8ff;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 14px;
  padding: 12px;
}
button {
  border: 3px solid white;
  background: #ffb52e;
  color: #17172b;
  font: bold 20px monospace;
  padding: 12px 22px;
  border-radius: 10px;
  cursor: pointer;
  touch-action: none;
}
button:active { background: #ff674d; transform: scale(.95); }
#message { color: #ffe66d; font-size: 18px; }
</style>
</head>
<body>
<h1>SUPER PIXEL ADVENTURE</h1>
<div id="info">
  ❤️ <span id="lives">3</span>
  &nbsp; 🪙 <span id="coins">0</span>
  &nbsp; 🏁 <span id="progress">0</span>%
</div>
<canvas id="game" width="960" height="540"></canvas>
<div class="controls">
  <button id="left">◀</button>
  <button id="jump">▲ JUMP</button>
  <button id="right">▶</button>
</div>
<div id="message">Reach the golden flag! Collect coins and stomp enemies.</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const keys = {};
let camera = 0, coinCount = 0, lives = 3;
let gameOver = false, won = false;
let frame = 0;

const worldWidth = 5200;
const gravity = 0.65;

const player = {
  x: 70, y: 300, w: 30, h: 40,
  vx: 0, vy: 0, speed: 4.3,
  grounded: false, invincible: 0
};

const platforms = [
  {x:0,y:470,w:700,h:100},
  {x:780,y:470,w:530,h:100},
  {x:1400,y:470,w:620,h:100},
  {x:2110,y:470,w:480,h:100},
  {x:2670,y:470,w:680,h:100},
  {x:3430,y:470,w:650,h:100},
  {x:4160,y:470,w:1040,h:100},

  {x:220,y:365,w:130,h:22},
  {x:440,y:300,w:120,h:22},
  {x:650,y:380,w:90,h:22},
  {x:900,y:350,w:130,h:22},
  {x:1110,y:285,w:110,h:22},
  {x:1510,y:350,w:150,h:22},
  {x:1730,y:290,w:120,h:22},
  {x:1920,y:365,w:90,h:22},
  {x:2200,y:330,w:140,h:22},
  {x:2440,y:265,w:120,h:22},
  {x:2780,y:355,w:130,h:22},
  {x:3000,y:290,w:140,h:22},
  {x:3260,y:355,w:100,h:22},
  {x:3510,y:325,w:150,h:22},
  {x:3760,y:255,w:130,h:22},
  {x:4050,y:350,w:110,h:22},
  {x:4350,y:335,w:150,h:22},
  {x:4630,y:275,w:150,h:22}
];

const coins = [];
for(let x=250; x<5000; x+=150) {
  let p = platforms.find(p => x > p.x && x < p.x+p.w && p.y < 440);
  coins.push({x, y:p ? p.y-35 : 420, got:false});
}
const enemies = [];
for(let x of [520,960,1190,1580,1830,2290,2850,3100,3570,3820,4400,4700]) {
  enemies.push({x,y:430,w:30,h:30,vx:1.1,alive:true,min:x-65,max:x+65});
}

const flagX = 5070;

function resetPlayer() {
  player.x = Math.max(40, camera + 30);
  player.y = 250;
  player.vx = 0;
  player.vy = 0;
  player.invincible = 100;
}

function restart() {
  player.x=70; player.y=300; player.vx=0; player.vy=0;
  camera=0; coinCount=0; lives=3;
  gameOver=false; won=false; frame=0;
  coins.forEach(c=>c.got=false);
  enemies.forEach(e=>{e.alive=true;e.vx=1.1;e.x=e.min+65;});
  document.getElementById("message").textContent =
    "Reach the golden flag! Collect coins and stomp enemies.";
}

function overlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x &&
         a.y < b.y+b.h && a.y+a.h > b.y;
}

function update() {
  if(gameOver || won) return;
  frame++;

  player.vx=0;
  if(keys.ArrowLeft || keys.a) player.vx=-player.speed;
  if(keys.ArrowRight || keys.d) player.vx=player.speed;

  if((keys.ArrowUp || keys[" "] || keys.w || keys.jump) && player.grounded) {
    player.vy=-13.5;
    player.grounded=false;
  }

  player.vy=Math.min(player.vy+gravity, 15);

  // Horizontal movement
  player.x+=player.vx;
  player.x=Math.max(0,Math.min(worldWidth-player.w,player.x));

  // Vertical collision
  const oldBottom=player.y+player.h;
  player.y+=player.vy;
  player.grounded=false;

  for(const p of platforms) {
    if(overlap(player,p)) {
      if(player.vy>=0 && oldBottom<=p.y+12) {
        player.y=p.y-player.h;
        player.vy=0;
        player.grounded=true;
      } else if(player.vy<0) {
        player.y=p.y+p.h;
        player.vy=0;
      }
    }
  }

  if(player.y>H+100) hurt();

  // Coins
  for(const c of coins) {
    if(!c.got && overlap(player,{x:c.x,y:c.y,w:20,h:20})) {
      c.got=true;
      coinCount++;
    }
  }

  // Enemies
  for(const e of enemies) {
    if(!e.alive) continue;
    e.x+=e.vx;
    if(e.x<e.min || e.x>e.max) e.vx*=-1;

    if(overlap(player,e)) {
      if(player.vy>1 && player.y+player.h-e.y<22) {
        e.alive=false;
        player.vy=-9;
      } else if(player.invincible<=0) {
        hurt();
      }
    }
  }

  if(player.invincible>0) player.invincible--;
  camera=Math.max(0,Math.min(worldWidth-W,player.x-W*0.36));

  if(player.x+player.w>=flagX) {
    won=true;
    document.getElementById("message").textContent =
      "🏆 YOU WIN! Coins collected: "+coinCount+" — Press R to play again";
  }

  document.getElementById("coins").textContent=coinCount;
  document.getElementById("lives").textContent=lives;
  document.getElementById("progress").textContent=
    Math.min(100,Math.floor(player.x/(flagX)*100));
}

function hurt() {
  if(player.invincible>0) return;
  lives--;
  if(lives<=0) {
    gameOver=true;
    document.getElementById("message").textContent=
      "GAME OVER! Press R to try again.";
  } else {
    resetPlayer();
  }
}

function rect(x,y,w,h,color) {
  ctx.fillStyle=color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function drawCloud(x,y) {
  rect(x,y+10,65,20,"#fff");
  rect(x+12,y,25,25,"#fff");
  rect(x+34,y+4,22,22,"#fff");
}

function drawBackground() {
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#53c9ff");
  sky.addColorStop(1,"#d0f5ff");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  // Sun
  rect(800,55,65,65,"#ffe66d");
  rect(790,70,85,35,"#ffe66d");

  for(let i=0;i<12;i++) {
    let x=((i*260-camera*.22)%(W+150)+W+150)%(W+150)-70;
    drawCloud(x,65+(i%3)*65);
  }

  // Distant hills
  for(let i=0;i<10;i++) {
    let x=i*220-camera*.4;
    rect(x,390,180,150,"#83d995");
    rect(x+35,360,110,50,"#83d995");
    rect(x+65,340,50,35,"#83d995");
  }
}

function drawPlatform(p) {
  rect(p.x,p.y,p.w,p.h,"#a75c35");
  rect(p.x,p.y,p.w,12,"#4ade80");
  rect(p.x,p.y+12,p.w,5,"#24934c");
  for(let x=p.x+8;x<p.x+p.w;x+=36) {
    rect(x,p.y+26,24,5,"#884527");
    rect(x+12,p.y+48,5,17,"#884527");
  }
}

function drawPlayer() {
  if(player.invincible>0 && Math.floor(frame/5)%2===0) return;
  const x=player.x, y=player.y;
  // Original pixel hero
  rect(x+6,y,18,8,"#65321f");
  rect(x+3,y+7,24,7,"#ffbd83");
  rect(x+3,y+14,24,8,"#ef4444");
  rect(x+7,y+15,5,5,"#fff");
  rect(x+19,y+15,5,5,"#fff");
  rect(x+9,y+16,3,4,"#111827");
  rect(x+20,y+16,3,4,"#111827");
  rect(x+7,y+22,16,5,"#ef4444");
  rect(x+5,y+27,20,9,"#2563eb");
  rect(x+1,y+24,6,13,"#ffbd83");
  rect(x+24,y+24,6,13,"#ffbd83");
  rect(x+5,y+36,8,4,"#4b281d");
  rect(x+19,y+36,8,4,"#4b281d");
}

function drawEnemy(e) {
  rect(e.x,e.y+7,30,19,"#8b4513");
  rect(e.x+4,e.y,22,13,"#b96c36");
  rect(e.x+6,e.y+12,7,8,"#fff");
  rect(e.x+18,e.y+12,7,8,"#fff");
  rect(e.x+9,e.y+14,3,5,"#111");
  rect(e.x+21,e.y+14,3,5,"#111");
  rect(e.x+3,e.y+26,9,4,"#542b20");
  rect(e.x+19,e.y+26,9,4,"#542b20");
}

function draw() {
  drawBackground();
  ctx.save();
  ctx.translate(-camera,0);

  for(const p of platforms) drawPlatform(p);

  for(const c of coins) {
    if(c.got) continue;
    ctx.fillStyle="#ffca28";
    ctx.beginPath();
    ctx.ellipse(c.x+10,c.y+10,9,12,0,0,Math.PI*2);
    ctx.fill();
    rect(c.x+8,c.y+3,4,14,"#fff19a");
  }

  for(const e of enemies) if(e.alive) drawEnemy(e);

  // Finish flag
  rect(flagX,300,8,170,"#e9e9e9");
  rect(flagX+8,305,65,42,"#ffcc35");
  rect(flagX+8,305,65,6,"#fff0a1");
  rect(flagX+8,341,65,6,"#f29a21");
  rect(flagX-10,465,35,7,"#7c3e25");

  drawPlayer();
  ctx.restore();

  if(gameOver || won) {
    ctx.fillStyle="rgba(10,15,35,.72)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";
    ctx.fillStyle=won?"#ffe66d":"#ff6b6b";
    ctx.font="bold 48px monospace";
    ctx.fillText(won?"YOU WIN!":"GAME OVER",W/2,H/2);
    ctx.fillStyle="#fff";
    ctx.font="22px monospace";
    ctx.fillText("Press R to restart",W/2,H/2+45);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp"," "].includes(e.key)) e.preventDefault();
  keys[e.key===" "?" ":e.key]=true;
  if(e.key.toLowerCase()==="r") restart();
});
document.addEventListener("keyup",e=>{
  keys[e.key===" "?" ":e.key]=false;
});

function bindButton(id,key) {
  const b=document.getElementById(id);
  const down=e=>{e.preventDefault();keys[key]=true;};
  const up=e=>{e.preventDefault();keys[key]=false;};
  b.addEventListener("pointerdown",down);
  b.addEventListener("pointerup",up);
  b.addEventListener("pointerleave",up);
  b.addEventListener("pointercancel",up);
}
bindButton("left","ArrowLeft");
bindButton("right","ArrowRight");
bindButton("jump","jump");

loop();
</script>
</body>
</html>
