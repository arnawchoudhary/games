<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meadow Drift | Arnaw Studios</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#65b8c8;color:white}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.box{background:#173d34eF;border:1px solid #ffffff44;padding:10px 13px;border-radius:14px;box-shadow:0 4px 15px #0003}
#stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
#bottom{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;gap:8px}
button{border:0;border-radius:10px;padding:11px 13px;background:#205440;color:white;font-weight:bold;cursor:pointer}
button.gold{background:#f2d28a;color:#493819}
button:active{transform:scale(.96)}
#hint{max-width:350px;text-align:center;font-size:12px;line-height:1.4}
#panel{position:fixed;right:12px;top:90px;width:min(340px,90vw);max-height:65vh;overflow:auto;background:#173d34f5;border:1px solid #ffffff55;border-radius:16px;padding:15px;display:none}
#panel.show{display:block}
#panel h2{color:#ffe4a5}
#panel button{margin:4px}
#modal{position:fixed;inset:0;background:#071d19cc;display:none;align-items:center;justify-content:center;padding:15px}
#modal.show{display:flex}
#modalContent{background:#204e3d;border:1px solid #ffffff55;border-radius:18px;padding:20px;width:min(480px,95vw);max-height:85vh;overflow:auto}
input{padding:11px;width:100%;margin:7px 0;border-radius:8px;border:0}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#f5dfa0;color:#46391e;padding:12px 18px;border-radius:12px;font-weight:bold;display:none;max-width:90vw;text-align:center}
#touch{position:fixed;bottom:90px;left:12px;display:none;grid-template-columns:44px 44px 44px;gap:4px}
#touch button{padding:10px;background:#173d34dd;font-size:18px}
@media(pointer:coarse){#touch{display:grid}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
 <div class="box"><b>🌿 MEADOW DRIFT</b><br><small>AN ARNAW STUDIOS GAME</small></div>
 <div class="box" id="stats">
  🪙 <b id="coins">160</b>
  🪵 <b id="wood">0</b>
  🫐 <b id="berries">0</b>
  🌷 <b id="flowers">0</b>
  <span id="season">🌱 Spring</span>
  <span id="clock">08:00 AM</span>
  <span id="weather">☀️ Sunny</span>
 </div>
</div>

<div id="touch">
 <button style="grid-column:2" data-key="up">▲</button>
 <button style="grid-column:1;grid-row:2" data-key="left">◀</button>
 <button style="grid-column:2;grid-row:2" data-key="down">▼</button>
 <button style="grid-column:3;grid-row:2" data-key="right">▶</button>
</div>

<div id="bottom">
 <div class="box">
  <button onclick="menu('quests')">📜 Quests</button>
  <button onclick="menu('bag')">🎒 Bag</button>
  <button onclick="menu('map')">🗺️ Map</button>
  <button onclick="menu('settings')">☰ Menu</button>
 </div>
 <div class="box" id="hint">Explore your island. Press E to interact.</div>
 <button class="gold" onclick="interact()">E · ACT</button>
</div>

<div id="panel"></div>
<div id="modal"><div id="modalContent"></div></div>
<div id="toast"></div>

<script>
// =====================================================
// SUPABASE CONFIGURATION
// Replace these two values with your own project details.
// NEVER put a Supabase service_role/secret key here.
// =====================================================
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

const supabaseReady =
 window.supabase &&
 SUPABASE_URL.startsWith("https://") &&
 !SUPABASE_URL.includes("YOUR_") &&
 SUPABASE_KEY.length > 30 &&
 !SUPABASE_KEY.includes("YOUR_");

const db = supabaseReady
 ? window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)
 : null;

// =====================================================
// GAME DATA
// =====================================================
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const TILE=44;
const seasons=["Spring","Summer","Autumn","Winter"];
const seasonIcons=["🌱","☀️","🍂","❄️"];

const freshGame=()=>({
 name:"Guest",
 coins:160,wood:0,berries:0,flowers:0,
 day:1,minutes:480,
 weather:"Sunny",
 wetUntil:0,
 player:{x:15,y:15},
 boat:{x:5,y:24},
 inBoat:false,
 inside:false,
 home:"Clover Cottage",
 furniture:["Sofa","Plant"],
 quests:[],
 reputation:0,
 traderVisits:0
});

let game=freshGame();
let user=null;
let offline=true;
let camera={x:0,y:0};
let lastTime=0;
let saveTimer=0;
let toastTimer;
let keys={up:false,down:false,left:false,right:false};
let villagers=[
 {name:"Milo",role:"Gardener",x:11,y:11,need:"wood",amount:3,reward:40},
 {name:"Luna",role:"Flower Artist",x:19,y:11,need:"flowers",amount:3,reward:45},
 {name:"Oliver",role:"Baker",x:11,y:18,need:"berries",amount:4,reward:50},
 {name:"Emma",role:"Book Lover",x:20,y:19,need:"wood",amount:2,reward:35},
 {name:"Noah",role:"Builder",x:5,y:16,need:"wood",amount:4,reward:55},
 {name:"Ravi",role:"Travelling Trader",x:26,y:5}
];

const buildings=[
 {name:"Clover Cottage",x:15,y:9,type:"home"},
 {name:"Market Square",x:8,y:14,type:"market"},
 {name:"Estate Office",x:21,y:14,type:"estate"},
 {name:"Meadow Harbour",x:5,y:24,type:"dock"},
 {name:"Notice Board",x:15,y:20,type:"board"}
];

const resources=[
 {x:6,y:8,type:"tree"},
 {x:24,y:8,type:"tree"},
 {x:8,y:22,type:"berry"},
 {x:22,y:22,type:"flower"},
 {x:25,y:18,type:"tree"}
];

function season(){
 return seasons[Math.floor((game.day-1)/7)%4];
}
function clockText(){
 let h=Math.floor(game.minutes/60)%24;
 let m=Math.floor(game.minutes%60);
 return String(h%12||12).padStart(2,"0")+":"+
 String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM");
}
function updateHUD(){
 document.getElementById("coins").textContent=game.coins;
 document.getElementById("wood").textContent=game.wood;
 document.getElementById("berries").textContent=game.berries;
 document.getElementById("flowers").textContent=game.flowers;
 document.getElementById("season").textContent=
 seasonIcons[seasons.indexOf(season())]+" "+season();
 document.getElementById("clock").textContent=clockText();
 document.getElementById("weather").textContent=
 game.weather==="Rain"?"🌧️ Rain":
 game.weather==="Snow"?"❄️ Snow":
 game.weather==="Cloudy"?"☁️ Cloudy":"☀️ Sunny";
}
function notify(message){
 let t=document.getElementById("toast");
 t.textContent=message;t.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.style.display="none",2400);
}
function hint(message){
 document.getElementById("hint").textContent=message;
}

// =====================================================
// SAVE SYSTEM
// =====================================================
function localKey(){
 return "MeadowDrift_"+(user?.id||"guest");
}
function saveLocal(){
 try{
  localStorage.setItem(localKey(),JSON.stringify(game));
 }catch(e){console.warn(e)}
}
async function saveGame(){
 saveLocal();
 if(db&&user){
  try{
   const {error}=await db.from("island_saves").upsert({
    user_id:user.id,
    save_data:game,
    updated_at:new Date().toISOString()
   },{onConflict:"user_id"});
   if(error)throw error;
   hint("☁️ Island synced with Supabase");
  }catch(e){
   console.error(e);
   hint("Cloud save failed. Local save is safe.");
  }
 }
}
function loadLocal(){
 try{
  const data=localStorage.getItem(localKey());
  if(data)game={...freshGame(),...JSON.parse(data)};
 }catch(e){}
}
async function loadCloud(){
 if(!db||!user)return false;
 try{
  const {data,error}=await db.from("island_saves")
   .select("save_data").eq("user_id",user.id).maybeSingle();
  if(error)throw error;
  if(data?.save_data){
   game={...freshGame(),...data.save_data};
   return true;
  }
 }catch(e){console.error(e);notify("Cloud save could not load.");}
 return false;
}
async function startGame(){
 if(db&&user){
  offline=false;
  if(!await loadCloud())loadLocal();
 }else{
  offline=true;
  loadLocal();
 }
 document.getElementById("modal").classList.remove("show");
 updateHUD();
 hint("Welcome to Meadow Drift! Explore your island.");
}

// =====================================================
// SUPABASE AUTH
// =====================================================
async function authenticate(mode){
 if(!db){
  document.getElementById("authMessage").textContent=
   "Supabase is not configured. Add your project URL and key, or play offline.";
  return;
 }
 let email=document.getElementById("email").value.trim();
 let password=document.getElementById("password").value;
 if(!email||password.length<6){
  document.getElementById("authMessage").textContent=
   "Enter an email and a password of at least 6 characters.";
  return;
 }
 try{
  let result=mode==="signup"
   ?await db.auth.signUp({email,password})
   :await db.auth.signInWithPassword({email,password});
  if(result.error)throw result.error;
  user=result.data.user;
  if(!user){
   document.getElementById("authMessage").textContent=
    "Check your email to confirm your account, then sign in.";
   return;
  }
  await startGame();
 }catch(e){
  document.getElementById("authMessage").textContent=e.message;
 }
}
function showLogin(){
 document.getElementById("modalContent").innerHTML=`
 <h2>🌿 Welcome to Meadow Drift</h2>
 <p>Create an account to sync your island across devices.</p>
 <label>Email</label><input id="email" type="email" placeholder="Email">
 <label>Password</label><input id="password" type="password" placeholder="6+ characters">
 <button class="gold" onclick="authenticate('signup')">Create account</button>
 <button onclick="authenticate('signin')">Sign in</button>
 <button onclick="startGame()">Play offline</button>
 <p id="authMessage">Supabase is optional. Offline progress stays on this device.</p>
 `;
 document.getElementById("modal").classList.add("show");
}

// =====================================================
// 2.5D ISOMETRIC WORLD
// =====================================================
function iso(x,y){
 return {x:(x-y)*TILE*.72,y:(x+y)*TILE*.36};
}
function screenPos(x,y,z=0){
 let p=iso(x,y);
 return {
  x:W/2+p.x-camera.x,
  y:H/2+p.y-camera.y-z
 };
}
function diamond(x,y,fill){
 let p=screenPos(x,y);
 ctx.beginPath();
 ctx.moveTo(p.x,p.y-TILE*.36);
 ctx.lineTo(p.x+TILE*.72,p.y);
 ctx.lineTo(p.x,p.y+TILE*.36);
 ctx.lineTo(p.x-TILE*.72,p.y);
 ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();
 ctx.strokeStyle="#ffffff15";ctx.stroke();
}
function tileType(x,y){
 if(x<2||y<2||x>27||y>27)return "water";
 if(x<4||y<4||x>25||y>25)return "sand";
 if((x===14||x===15)&&y>18&&y<25)return "path";
 if((y===14||y===15)&&x>5&&x<24)return "path";
 return "grass";
}
function drawTiles(t){
 for(let y=0;y<30;y++){
  for(let x=0;x<30;x++){
   let type=tileType(x,y),fill;
   if(type==="water")fill="#55b6c6";
   else if(type==="sand")fill="#e9d5a1";
   else if(type==="path")fill="#c9a979";
   else{
    let palette={
     Spring:["#85c878","#8ccc7b"],
     Summer:["#83bd5e","#92c969"],
     Autumn:["#b88b50","#c79a59"],
     Winter:["#d9e6dc","#e8eee6"]
    }[season()];
    fill=palette[Math.floor((x*7+y*11)%2)];
   }
   diamond(x,y,fill);
   if(type==="water"&&Math.sin(t/500+x*2+y)>0.93){
    let p=screenPos(x,y);
    ctx.strokeStyle="#e6ffff80";
    ctx.beginPath();ctx.moveTo(p.x-7,p.y);ctx.lineTo(p.x+7,p.y);ctx.stroke();
   }
  }
 }
}
function drawTree(x,y,t){
 let p=screenPos(x,y);
 ctx.fillStyle="#79543a";ctx.fillRect(p.x-4,p.y-28,8,28);
 let c=season()==="Autumn"?"#d48b42":
       season()==="Winter"?"#edf4ed":
       season()==="Summer"?"#4e974f":"#59ae68";
 for(let i=0;i<3;i++){
  ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(p.x+(i-1)*8,p.y-39-i*7,16-i*2,0,Math.PI*2);ctx.fill();
 }
}
function drawBuilding(x,y,name,wall,roof){
 let p=screenPos(x,y),w=70,h=48;
 ctx.fillStyle=wall;ctx.fillRect(p.x-w/2,p.y-h,w,h);
 ctx.beginPath();ctx.moveTo(p.x-w/2,p.y-h);
 ctx.lineTo(p.x,p.y-h-30);ctx.lineTo(p.x+w/2,p.y-h);
 ctx.closePath();ctx.fillStyle=roof;ctx.fill();
 ctx.fillStyle="#79563e";ctx.fillRect(p.x-8,p.y-25,16,25);
 ctx.fillStyle="#bde8ee";
 ctx.fillRect(p.x-27,p.y-34,13,12);
 ctx.fillRect(p.x+14,p.y-34,13,12);
 ctx.fillStyle="white";ctx.font="bold 10px Arial";ctx.textAlign="center";
 ctx.fillText(name,p.x,p.y+13);
}
function drawPerson(x,y,name,color,t){
 let p=screenPos(x,y);
 let bob=Math.sin(t/350+x)*1.5;
 ctx.fillStyle="#183d3455";
 ctx.beginPath();ctx.ellipse(p.x,p.y,10,5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=color;
 ctx.beginPath();ctx.ellipse(p.x,p.y-17+bob,10,13,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#f1c6a1";
 ctx.beginPath();ctx.arc(p.x,p.y-34+bob,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#493a32";
 ctx.beginPath();ctx.arc(p.x,p.y-38+bob,9,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle="#263c35";
 ctx.fillRect(p.x-4,p.y-35+bob,2,2);ctx.fillRect(p.x+3,p.y-35+bob,2,2);
 ctx.fillStyle="#173d34";ctx.font="bold 10px Arial";ctx.textAlign="center";
 ctx.fillText(name,p.x,p.y-50+bob);
}
function drawBoat(){
 let p=screenPos(game.boat.x,game.boat.y);
 ctx.fillStyle="#865333";
 ctx.beginPath();ctx.moveTo(p.x-24,p.y-5);ctx.lineTo(p.x+24,p.y-5);
 ctx.lineTo(p.x+14,p.y+9);ctx.lineTo(p.x-14,p.y+9);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff2cb";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(p.x,p.y-5);ctx.lineTo(p.x,p.y-46);ctx.stroke();
 ctx.fillStyle="#fff0c6";
 ctx.beginPath();ctx.moveTo(p.x+2,p.y-44);ctx.lineTo(p.x+2,p.y-10);ctx.lineTo(p.x+24,p.y-14);ctx.closePath();ctx.fill();
}
function drawWorld(t){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#5db6c7";ctx.fillRect(0,0,W,H);
 drawTiles(t);
 resources.forEach(n=>{
  if(n.type==="tree")drawTree(n.x,n.y,t);
  else{
   let p=screenPos(n.x,n.y);
   ctx.font="24px Arial";ctx.textAlign="center";
   ctx.fillText(n.type==="berry"?"🫐":"🌷",p.x,p.y);
  }
 });
 drawBuilding(15,9,game.home,"#f1d8ae","#bd795e");
 drawBuilding(8,14,"MARKET","#f1d8ae","#d0a057");
 drawBuilding(21,14,"ESTATE","#dcebd6","#719b84");
 drawBoat();

 if(!game.inBoat&&!game.inside){
  if(game.minutes<1080){
   villagers.filter(v=>v.name!=="Ravi").forEach(v=>
    drawPerson(v.x,v.y,v.name,"#e7a46f",t));
   if(game.day%3===0){
    let r=villagers.find(v=>v.name==="Ravi");
    drawPerson(r.x,r.y,"Ravi","#d6a06c",t);
   }
  }
  drawPerson(game.player.x,game.player.y,game.name,"#8eb8e8",t);
 }
 if(game.inBoat){
  let p=screenPos(game.boat.x,game.boat.y);
  ctx.fillStyle="#173d34";ctx.font="bold 12px Arial";ctx.textAlign="center";
  ctx.fillText(game.name,p.x,p.y-55);
 }
 // Season effects
 if(season()==="Autumn"||season()==="Winter"){
  for(let i=0;i<25;i++){
   let x=(i*87+t*.025)%W,y=(i*59+t*.04)%H;
   ctx.fillStyle=season()==="Winter"?"#fff":"#d78d45";
   ctx.globalAlpha=.7;ctx.beginPath();
   ctx.arc(x,y,season()==="Winter"?2:3,0,Math.PI*2);ctx.fill();
   ctx.globalAlpha=1;
  }
 }
 // Weather
 if(game.weather==="Rain"||game.weather==="Snow"){
  for(let i=0;i<110;i++){
   let x=(i*97+t*.15)%W,y=(i*53+t*(game.weather==="Rain"?.42:.1))%H;
   ctx.strokeStyle=game.weather==="Rain"?"#e6f9ff99":"#ffffffbb";
   ctx.beginPath();ctx.moveTo(x,y);
   ctx.lineTo(x+(game.weather==="Rain"?-3:0),y+(game.weather==="Rain"?12:4));ctx.stroke();
  }
 }
 let hour=game.minutes/60;
 if(hour<6||hour>=19){ctx.fillStyle="#14264b66";ctx.fillRect(0,0,W,H)}
 else if(hour>=17){ctx.fillStyle="#ed9c4a22";ctx.fillRect(0,0,W,H)}
 if(Date.now()<game.wetUntil){ctx.fillStyle="#80c8dc20";ctx.fillRect(0,0,W,H)}
}

// =====================================================
// PLAYER, BOAT AND CAMERA
// =====================================================
function move(dt){
 if(document.getElementById("modal").classList.contains("show"))return;
 let dx=(keys.right?1:0)-(keys.left?1:0);
 let dy=(keys.down?1:0)-(keys.up?1:0);
 let len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
 let target=game.inBoat?game.boat:game.player;
 if(dx||dy){
  target.x+=dx*dt*.006;
  target.y+=dy*dt*.006;
  if(!game.inBoat){
   target.x=Math.max(3,Math.min(26,target.x));
   target.y=Math.max(3,Math.min(26,target.y));
  }
 }
 let p=iso(target.x,target.y);
 camera.x+=(p.x-camera.x)*.12;
 camera.y+=(p.y-camera.y)*.12;
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(){
 let target=game.inBoat?game.boat:game.player;
 let list=buildings.map(o=>({...o,d:distance(target,o)}));
 villagers.forEach(v=>{
  if(v.name!=="Ravi"||(game.day%3===0&&game.minutes<1080))
   list.push({...v,type:"villager",d:distance(target,v)});
 });
 resources.forEach(n=>list.push({...n,type:"resource",d:distance(target,n)}));
 return list.sort((a,b)=>a.d-b.d)[0];
}

// =====================================================
// INTERACTIONS, QUESTS AND SHOPS
// =====================================================
function showModal(title,html){
 document.getElementById("modalContent").innerHTML=
 `<h2>${title}</h2>${html}<button onclick="closeModal()">Close</button>`;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function talk(v){
 if(v.name==="Ravi"){
  if(game.day%3!==0){notify("Ravi visits every third day.");return}
  showModal("⛵ Ravi's Rare Shop",shopHTML(true));return;
 }
 let q=game.quests.find(q=>q.name===v.name);
 if(!q){
  q={name:v.name,need:v.need,amount:v.amount,reward:v.reward,done:false};
  game.quests.push(q);
  notify(v.name+" gave you a quest!");
 }else if(!q.done&&game[q.need]>=q.amount){
  game[q.need]-=q.amount;game.coins+=q.reward;q.done=true;
  game.reputation++;
  notify("Quest completed! +"+q.reward+" coins");
 }else notify(q.done?"Thanks for helping!":"Keep collecting "+q.need+".");
 updateHUD();saveGame();
}
function shopHTML(rare=false){
 let items=rare?
 [["🔭 Star Telescope",130],["⛲ Moon Fountain",180],["🕹️ Arcade Cabinet",150]]:
 [["🛋️ Cloud Sofa",60],["📺 Smart TV",85],["🪴 Indoor Plant",20],
 ["🛏️ Cosy Bed",65],["🪑 Garden Chair",35],["📚 Bookshelf",55]];
 return `<p>Choose something for your home.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">`+
 items.map(([name,price])=>`<div style="background:#ffffff18;padding:9px;border-radius:9px">${name}<br>🪙 ${price}<br><button onclick="buy('${name}',${price})">Buy</button></div>`).join("")+
 `</div>`;
}
function buy(name,price){
 if(game.coins<price){notify("Not enough coins!");return}
 game.coins-=price;game.furniture.push(name);
 updateHUD();saveGame();notify(name+" added to your furniture bag!");
}
function interact(){
 if(document.getElementById("modal").classList.contains("show"))return;
 let n=nearest();
 if(!n||n.d>2.2){notify("Move closer to something first.");return}
 if(n.type==="villager"){talk(n);return}
 if(n.type==="resource"){
  let k=n.type==="resource"?(n.type==="tree"?"wood":n.type):n.type;
  let original=resources.find(r=>r.x===n.x&&r.y===n.y);
  let amount=original.type==="tree"?2:3;
  let item=original.type==="tree"?"wood":original.type==="berry"?"berries":"flowers";
  game[item]+=amount;notify("+"+amount+" "+item);updateHUD();saveGame();return;
 }
 if(n.type==="home"){
  game.inside=!game.inside;
  notify(game.inside?"Welcome home!":"Enjoy the island!");
  return;
 }
 if(n.type==="market"){
  showModal("🏪 Meadow Market",`<p>Sell your harvest for coins.</p>
  <button onclick="sell('wood',4)">Sell wood · 4 coins each</button>
  <button onclick="sell('berries',5)">Sell berries · 5 coins each</button>
  <button onclick="sell('flowers',7)">Sell flowers · 7 coins each</button>
  ${shopHTML()}`);return;
 }
 if(n.type==="estate"){
  showModal("🏡 Estate Office",`<p>Choose your dream home.</p>
  <button onclick="buyHome('Garden Cottage',160)">Garden Cottage · 160</button>
  <button onclick="buyHome('Willow Villa',360)">Willow Villa · 360</button>
  <button onclick="buyHome('Beach House',420)">Beach House · 420</button>
  <button onclick="buyHome('Forest Lodge',520)">Forest Lodge · 520</button>`);return;
 }
 if(n.type==="dock"){
  game.inBoat=!game.inBoat;
  if(game.inBoat){game.boat={x:5,y:24};notify("You boarded the boat! Sail across the sea.");}
  else{game.player={x:5,y:23};notify("Back on Meadow Island!");}
  return;
 }
 if(n.type==="board"){
  showModal("📋 Notice Board",`<p>Island day ${game.day} · ${season()}</p><p>Reputation: ${game.reputation}</p><p>Community goal: make the island welcoming!</p>`);
 }
}
function sell(item,price){
 let amount=game[item];
 if(!amount){notify("You don't have any "+item+".");return}
 game.coins+=amount*price;game[item]=0;updateHUD();saveGame();notify("Harvest sold!");
}
function buyHome(name,cost){
 if(game.coins<cost){notify("You need more coins!");return}
 game.coins-=cost;game.home=name;updateHUD();saveGame();notify("Your new home is ready!");
}

// =====================================================
// MENUS
// =====================================================
function menu(which){
 let p=document.getElementById("panel");p.classList.add("show");
 if(which==="quests"){
  p.innerHTML="<h2>📜 Island Journal</h2>"+
  (game.quests.length?game.quests.map(q=>
   `<p>${q.name}: ${q.done?"✅ Done":Math.min(game[q.need],q.amount)+"/"+q.amount+" "+q.need}</p>`).join(""):"<p>Meet neighbours to get quests.</p>")+
  "<p>⭐ Reputation: "+game.reputation+"</p>";
 }else if(which==="bag"){
  p.innerHTML=`<h2>🎒 Backpack</h2><p>🪵 Wood: ${game.wood}</p><p>🫐 Berries: ${game.berries}</p><p>🌷 Flowers: ${game.flowers}</p><p>Furniture: ${game.furniture.join(", ")}</p>`;
 }else if(which==="map"){
  p.innerHTML="<h2>🗺️ Meadow Island</h2><p>North: Clover Cottage</p><p>Centre: Market and Estate Office</p><p>South: Meadow Harbour</p><p>East: Ravi's travelling ship</p>";
 }else{
  p.innerHTML=`<h2>☰ Island Menu</h2>
  <button onclick="decorate()">🪑 Decorate home</button>
  <button onclick="sleep()">🌙 Sleep</button>
  <button onclick="saveGame();notify('Island saved!')">💾 Save now</button>
  <button onclick="closePanel()">Close menu</button>
  <p>Controls: WASD / arrows to move · E to interact.</p>
  <p>${offline?"Offline save":"Supabase cloud save"}</p>`;
 }
}
function closePanel(){document.getElementById("panel").classList.remove("show")}
function decorate(){
 showModal("🪑 Home Decoration",
 `<p>Choose furniture to add to your home.</p>
 ${["🛋️ Sofa","📺 Smart TV","🪴 Plant","🪑 Chair","📚 Bookshelf","🎹 Piano","🛏️ Bed"].map(n=>
 `<button onclick="placeFurniture('${n}')">${n}</button>`).join("")}`);
}
function placeFurniture(name){
 game.furniture.push(name);saveGame();notify(name+" added to your home collection.");
}
function sleep(){
 if(game.minutes<1080){notify("You can sleep after 6:00 PM.");return}
 game.day++;game.minutes=480;game.weather="Sunny";game.wetUntil=0;
 game.quests=[];closePanel();updateHUD();saveGame();
 notify("A new day begins on Meadow Island!");
}

// =====================================================
// TIME, SEASONS AND WEATHER
// =====================================================
let lastHour=Math.floor(game.minutes/60);
let lastNoticeDay=-1;
function updateClock(dt){
 let old=game.minutes;
 game.minutes+=dt*.025;
 if(game.minutes>=1440){game.minutes=0;game.day++}
 let hour=Math.floor(game.minutes/60);
 if(hour!==lastHour){
  lastHour=hour;
  if(hour%3===0){
   let r=Math.random();
   game.weather=season()==="Winter"?(r<.4?"Snow":"Cloudy"):
    r<.25?"Rain":r<.5?"Cloudy":"Sunny";
   if(game.weather==="Rain")game.wetUntil=Date.now()+300000;
   updateHUD();
  }
 }
 if(game.minutes>=1080&&lastNoticeDay!==game.day){
  lastNoticeDay=game.day;
  notify("everyone is now sleeping go and sleep or work all night");
  // Toast stays for five seconds at 6 PM.
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>document.getElementById("toast").style.display="none",5000);
 }
 if(old>game.minutes&&game.minutes===0)updateHUD();
}

// =====================================================
// INPUT
// =====================================================
addEventListener("keydown",e=>{
 let k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 if(k==="w"||k==="arrowup")keys.up=true;
 if(k==="s"||k==="arrowdown")keys.down=true;
 if(k==="a"||k==="arrowleft")keys.left=true;
 if(k==="d"||k==="arrowright")keys.right=true;
 if(k==="e"||k===" ")interact();
});
addEventListener("keyup",e=>{
 let k=e.key.toLowerCase();
 if(k==="w"||k==="arrowup")keys.up=false;
 if(k==="s"||k==="arrowdown")keys.down=false;
 if(k==="a"||k==="arrowleft")keys.left=false;
 if(k==="d"||k==="arrowright")keys.right=false;
});
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));
document.querySelectorAll("[data-key]").forEach(b=>{
 let k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  b.addEventListener(ev,()=>keys[k]=false));
});
canvas.addEventListener("pointerdown",e=>{
 if(document.getElementById("modal").classList.contains("show"))return;
 let sx=e.clientX-W/2+camera.x,sy=e.clientY-H/2+camera.y;
 let wx=(sx/(TILE*.72)+sy/(TILE*.36))/2;
 let wy=(sy/(TILE*.36)-sx/(TILE*.72))/2;
 let target=game.inBoat?game.boat:game.player;
 target.x=Math.max(3,Math.min(26,wx));
 target.y=Math.max(3,Math.min(26,wy));
});

// =====================================================
// MAIN LOOP
// =====================================================
function frame(t){
 let dt=Math.min(40,t-(lastTime||t));lastTime=t;
 if(!document.getElementById("modal").classList.contains("show")){
  move(dt);updateClock(dt);
  if(t-saveTimer>15000){saveTimer=t;saveGame()}
 }
 drawWorld(t);updateHUD();
 requestAnimationFrame(frame);
}
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")closeModal();
});
document.getElementById("panel").addEventListener("click",e=>{
 if(e.target===document.getElementById("panel"))closePanel();
});
document.getElementById("panel").addEventListener("wheel",e=>e.stopPropagation());
addEventListener("beforeunload",saveGame);

updateHUD();
showLogin();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
